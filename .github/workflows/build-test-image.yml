name: build-test-image
on:
  push:
    branches: ['cooperc/ssh-key-race-fix*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/skypilot-7164:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/skypilot-7164:latest
      - name: Make package public
        run: |
          gh api -X PATCH /user/packages/container/skypilot-7164/visibility \
            -f visibility=public || echo "visibility flip failed (may need manual flip)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
